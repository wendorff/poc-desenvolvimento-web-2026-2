<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Usuários', '/users', ~{::content})}">
<body>
<th:block th:fragment="content">

    <header class="page-header">
        <div>
            <p class="eyebrow">Administração</p>
            <h1>Usuários</h1>
            <p class="page-lead">Quem acessa o SGFH e com qual papel. A senha é guardada apenas como hash.</p>
        </div>
    </header>

    <section class="panel" aria-labelledby="user-form-title">
        <header class="panel-header">
            <h2 id="user-form-title" th:text="${userForm.id} == null ? 'Novo usuário' : 'Editar usuário'">Novo usuário</h2>
            <span class="badge badge-warning" th:if="${userForm.id != null}">Editando</span>
        </header>

        <form class="panel-body form" th:action="@{/users}" th:object="${userForm}" method="post" novalidate
              hx-disabled-elt="find button[type='submit']" hx-indicator="find button[type='submit']">

            <div class="alert alert-error" role="alert" tabindex="-1" autofocus
                 th:if="${#fields.hasAnyErrors() or error != null}">
                <svg th:replace="~{fragments/icons :: icon('circle-x')}"></svg>
                <div>
                    <p class="alert-title">Não foi possível salvar o usuário.</p>
                    <p th:text="${error} ?: 'Revise os campos destacados abaixo.'">Revise os campos destacados abaixo.</p>
                </div>
            </div>

            <input type="hidden" th:field="*{id}">

            <div class="form-grid">
                <div class="field">
                    <label for="name">Nome completo <span class="required" aria-hidden="true">*</span></label>
                    <input type="text" th:field="*{name}" autocomplete="name" required maxlength="120"
                           th:autofocus="${userForm.id != null and !#fields.hasAnyErrors()}"
                           th:attr="aria-invalid=${#fields.hasErrors('name')} ? 'true', aria-describedby=${#fields.hasErrors('name')} ? 'name-error'">
                    <p class="field-error" id="name-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
                </div>

                <div class="field">
                    <label for="email">E-mail <span class="required" aria-hidden="true">*</span></label>
                    <input type="email" th:field="*{email}" autocomplete="off" required spellcheck="false"
                           th:attr="aria-invalid=${#fields.hasErrors('email')} ? 'true', aria-describedby=${#fields.hasErrors('email')} ? 'email-error'">
                    <p class="field-error" id="email-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                </div>

                <div class="field">
                    <label for="password">
                        Senha <span class="required" aria-hidden="true" th:if="${userForm.id == null}">*</span>
                    </label>
                    <input id="password" type="password" name="password" autocomplete="new-password"
                           th:required="${userForm.id == null}" aria-describedby="password-hint">
                    <p class="hint" id="password-hint"
                       th:text="${userForm.id} == null ? 'Mínimo de 6 caracteres.' : 'Deixe em branco para manter a senha atual.'">
                        Mínimo de 6 caracteres.</p>
                </div>

                <div class="field">
                    <label for="roleId">Papel <span class="required" aria-hidden="true">*</span></label>
                    <select th:field="*{roleId}" required
                            th:attr="aria-invalid=${#fields.hasErrors('roleId')} ? 'true', aria-describedby=${#fields.hasErrors('roleId')} ? 'roleId-error'">
                        <option value="">Selecione…</option>
                        <option th:each="role : ${roles}" th:value="${role.id}" th:text="${role.name}">PAPEL</option>
                    </select>
                    <p class="field-error" id="roleId-error" th:if="${#fields.hasErrors('roleId')}" th:errors="*{roleId}"></p>
                </div>
            </div>

            <label class="check">
                <input type="checkbox" name="active" value="true" th:checked="${userForm.isActive()}">
                <span class="check-text">
                    <strong>Usuário ativo</strong>
                    <span class="hint">Usuários inativos não conseguem entrar no sistema.</span>
                </span>
            </label>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <span class="spinner htmx-indicator" aria-hidden="true"><svg th:replace="~{fragments/icons :: icon('loader')}"></svg></span>
                    <span th:text="${userForm.id} == null ? 'Cadastrar usuário' : 'Salvar alterações'">Cadastrar usuário</span>
                </button>
                <a class="btn btn-secondary" th:href="@{/users}" th:if="${userForm.id != null}">Cancelar</a>
                <p class="form-note"><span class="required" aria-hidden="true">*</span> Campos obrigatórios</p>
            </div>
        </form>
    </section>

    <section class="panel" aria-labelledby="users-title">
        <header class="panel-header">
            <h2 id="users-title">Usuários cadastrados</h2>
            <form class="search" role="search" th:action="@{/users}" method="get"
                  th:attr="hx-get=@{/users}" hx-trigger="input delay:300ms, submit"
                  hx-target="#table-area" hx-select="#table-area" hx-swap="outerHTML"
                  hx-indicator="find .search-indicator" hx-sync="this:replace">
                <label class="visually-hidden" for="user-search">Buscar usuário</label>
                <svg th:replace="~{fragments/icons :: icon('search')}"></svg>
                <input id="user-search" type="search" name="q" th:value="${query}"
                       placeholder="Buscar por nome, e-mail ou papel" autocomplete="off" spellcheck="false">
                <span class="search-indicator spinner htmx-indicator" aria-hidden="true">
                    <svg th:replace="~{fragments/icons :: icon('loader')}"></svg>
                </span>
            </form>
        </header>
        <div th:replace="~{users/table :: table}"></div>
    </section>

</th:block>
</body>
</html>
