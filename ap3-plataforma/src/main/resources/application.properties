spring.application.name=sgfh

spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/sgfh}
spring.data.mongodb.auto-index-creation=true

server.port=${PORT:8080}

spring.thymeleaf.cache=false

# Arquivos gerados pelo Vite: servidos apenas em /assets, com o hash do conteúdo na URL
# (o Thymeleaf reescreve @{/assets/...}) e cache longo, já que cada versão tem URL própria
spring.mvc.static-path-pattern=/assets/**
spring.web.resources.static-locations=classpath:/static/assets/
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true

sgfh.integrations.connect-timeout=5s
sgfh.integrations.read-timeout=10s
sgfh.integrations.user-agent=SGFH/0.1 (projeto academico UFCSPA)
sgfh.integrations.anvisa-base-url=https://consultas.anvisa.gov.br
sgfh.integrations.rxnav-base-url=https://rxnav.nlm.nih.gov
sgfh.integrations.brasilapi-base-url=https://brasilapi.com.br
